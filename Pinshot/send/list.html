<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title data-i18n="title">Pinshot 내 목록</title>
<style>
  :root { --bg: #f4f5f8; --card: #fff; --ink: #1b2030; --ink2: #5a6275; --line: #d6dae2; --accent: #007aff; --ok: #34c759; --bad: #d64545; --star: #f5b400; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111317; --card: #1b1e24; --ink: #eceff5; --ink2: #a9b2c3; --line: #2f3540; --accent: #4c8dff; --bad: #ff6b6b; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; line-height: 1.55; padding: 32px 16px 48px; }
  main { max-width: 960px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 22px; margin: 0; }
  p { margin: 0; color: var(--ink2); font-size: 15px; }
  button { font: inherit; font-size: 15px; font-weight: 600; padding: 10px 20px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  button.plain { background: transparent; color: var(--accent); padding: 6px 0; font-weight: 500; }
  [hidden] { display: none !important; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .lang { display: flex; gap: 2px; font-size: 13px; flex-wrap: wrap; }
  :lang(ja) { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", "Noto Sans JP", sans-serif; }
  :lang(zh) { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
  .lang button { font-size: 13px; font-weight: 500; padding: 2px 8px; border-radius: 6px; background: none; color: var(--ink2); }
  .lang button.on { color: var(--ink); background: var(--bg); font-weight: 600; }
  .ptabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
  .ptabs a, .ptabs button { font-size: 15px; font-weight: 600; text-decoration: none; background: none; color: var(--ink2); padding: 8px 14px 10px; border-radius: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .views { margin-left: auto; align-self: center; display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .views button { padding: 5px 9px; margin: 0; border: 0; border-radius: 0; background: transparent; color: var(--ink2); display: flex; }
  .views button + button { border-left: 1px solid var(--line); }
  .views button.on { background: var(--accent); color: #fff; }
  .views svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ptabs .on { color: var(--accent); border-bottom-color: var(--accent); }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .bar input[type=search] { flex: 1; min-width: 180px; font: inherit; font-size: 15px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .label { font-size: 13px; color: var(--ink2); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tags button { font-size: 13px; font-weight: 500; padding: 3px 10px; border-radius: 14px; background: var(--bg); color: var(--ink2); border: 1px solid var(--line); }
  .tags button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .it { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; background: var(--card); }
  .it .pic { height: 150px; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--ink2); font-size: 13px; }
  .it .pic img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .it .memo { height: 150px; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; font-size: 14px; overflow: hidden; background: #fff6b8; color: #1b2030; }
  .it .meta { padding: 8px 12px 10px; }
  .it .tt { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 메모 탭: 줄 목록 (왼쪽 작은 그림 · 이름 · 내용 첫 줄 · 날짜와 태그) */
  .grid.rows { grid-template-columns: 1fr; gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .rows .it { flex-direction: row; align-items: center; gap: 12px; border: 0; border-radius: 0; border-bottom: 1px solid var(--line); padding: 8px 12px; }
  .rows .it:last-child { border-bottom: 0; }
  .rows .it:hover { background: var(--bg); }
  .rows .it .pic, .rows .it .memo { width: 48px; height: 48px; flex: none; border-radius: 8px; padding: 0; font-size: 11px; overflow: hidden; }
  .rows .it .memo { padding: 4px 5px; line-height: 1.3; }
  .rows .it .meta { padding: 0; min-width: 0; flex: 1; }
  .rows .it .line { font-size: 13px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .it .tt .star { color: var(--star); margin-right: 4px; }
  .it .sub { font-size: 12px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .locked .pic { font-size: 14px; }
  .pempty { border: 1.5px dashed var(--line); border-radius: 12px; padding: 26px 14px; text-align: center; font-size: 14px; color: var(--ink2); }
  .err { color: var(--bad); font-size: 14px; }
  .it { cursor: pointer; }
  .it:hover { border-color: var(--accent); }
  dialog { border: 1px solid var(--line); border-radius: 16px; padding: 0; background: var(--card); color: var(--ink); width: min(640px, 94vw); max-height: 90vh; overflow: hidden; }
  .dlg .dh b { flex: 1; }
  #dbig, #dclose { display: flex; padding: 4px; }
  #dclose svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  #dbig[hidden], .zc[hidden] { display: none; }
  #dbig svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .zc { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink2); }
  .zc button { padding: 3px 10px; font-size: 14px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
  .zc #zpct { min-width: 44px; text-align: center; }
  /* 크게 보기: 같은 창을 화면 전체로, 휠 확대 · 끌어 이동 */
  dialog.big { width: 100vw; max-width: 100vw; height: 100vh; max-height: 100vh; border: 0; border-radius: 0; }
  dialog.big .dlg { height: 100vh; max-height: 100vh; }
  dialog.big .db { flex: 1; padding: 0; overflow: hidden; position: relative; cursor: grab; background: #111; touch-action: none; }
  dialog.big .db.drag { cursor: grabbing; }
  dialog.big .db > :not(.pics) { display: none; }
  dialog.big .pics { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  dialog.big .pics img { max-width: none; width: 100%; border-radius: 0; margin: 0; user-select: none; -webkit-user-drag: none; }
  .dlg .df { padding: 12px 18px; border-top: 1px solid var(--line); }
  .dlg .df:empty { display: none; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  .dlg { display: flex; flex-direction: column; max-height: 90vh; }
  .dlg .dh { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .dlg .dh b { font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dlg .db { padding: 16px 18px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
  .dlg .full { white-space: pre-wrap; word-break: break-word; font-size: 15px; background: #fff6b8; color: #1b2030; border-radius: 10px; padding: 14px; }
  .dlg img { max-width: 100%; border-radius: 10px; display: block; margin: 0 auto; }
  .dlg .sub { font-size: 13px; color: var(--ink2); }
  .dlg .db > div > img + img { margin-top: 0; }
  .unlock { display: flex; flex-direction: column; gap: 10px; }
  .unlock input { font: inherit; font-size: 15px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
  .unlock button { align-self: flex-start; }
  .ed { display: flex; flex-direction: column; gap: 10px; }
  .ed input, .ed textarea { font: inherit; font-size: 15px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
  .ed textarea { min-height: 220px; resize: vertical; }
  .acts { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button.ghost { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
  button.danger { background: transparent; color: var(--bad); border: 1px solid var(--line); margin-left: auto; }
  .wait { color: var(--accent); }
  .who { font-size: 13px; color: var(--ink2); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<main>
  <div class="head">
    <h1 data-i18n="title">Pinshot 내 목록</h1>
    <div class="lang" id="lang" role="group" aria-label="Language"><button type="button" data-lang="ko" lang="ko">한국어</button><button type="button" data-lang="zh" lang="zh-Hans">中文</button><button type="button" data-lang="ja" lang="ja">日本語</button><button type="button" data-lang="en" lang="en">English</button></div>
  </div>
  <nav class="ptabs">
    <a href="./" data-i18n="navSend">주고받기</a>
    <a href="list.html" class="on" data-i18n="navList">내 목록</a>
  </nav>

  <section id="signin">
    <p data-i18n-html="intro">아이폰 Pinshot의 설정 &gt; 백업 &gt; 구글 드라이브에서 <b>PC와 동기화</b>를 켜 두면, 같은 구글 계정으로 로그인해 여기서 목록을 볼 수 있습니다.</p>
    <p style="margin-top:14px"><button id="login" type="button" data-i18n="login">구글 계정으로 로그인</button></p>
    <p class="label" style="margin-top:10px" data-i18n="privacy">목록은 이 브라우저가 내 구글 드라이브에서 바로 읽습니다. Pinshot 서버를 거치지 않습니다.</p>
  </section>

  <section id="app" hidden>
    <div class="who"><span id="synced"></span><button class="plain" id="reload" type="button" data-i18n="reload">앱 내용 가져오기</button><button class="plain" id="logout" type="button" data-i18n="logout">로그아웃</button></div>
    <div class="ptabs" role="tablist" style="margin-top:8px">
      <button type="button" data-tab="memo" class="on" role="tab" data-i18n="tabMemo">메모</button>
      <button type="button" data-tab="note" role="tab" data-i18n="tabNote">노트</button>
      <div class="views" id="views" role="group">
        <button type="button" data-view="list" id="vList"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
        <button type="button" data-view="card" id="vCard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></button>
      </div>
    </div>
    <div class="bar" style="margin-top:12px">
      <input type="search" id="q" data-i18n-ph="search" placeholder="검색">
      <span class="label" id="count"></span>
      <button type="button" id="add">+ 새 메모</button>
    </div>
    <div class="tags" id="tags" style="margin-top:10px"></div>
    <div class="grid" id="grid" style="margin-top:12px"></div>
    <div class="pempty" id="empty" hidden></div>
    <p class="sub" data-i18n="limits" style="margin-top:14px;font-size:13px"></p>
    <p data-i18n="publicPC" style="margin-top:6px;font-size:13px;color:var(--bad)"></p>
  </section>
  <div class="err" id="err" hidden></div>
</main>
<dialog id="dlg"><div class="dlg">
  <div class="dh"><b id="dtitle"></b>
    <span class="zc" id="zctl" hidden><button type="button" id="zout">−</button><span id="zpct">100%</span><button type="button" id="zin">+</button><button type="button" id="z1" data-i18n="actual">원본 크기</button></span>
    <button class="plain" id="dbig" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
    <button class="plain" id="dclose" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="db" id="dbody"></div>
  <div class="df" id="dfoot"></div>
</div></dialog>

      return;
    }
    var wait = document.createElement('div'); wait.className = 'sub'; wait.textContent = t('loading'); body.appendChild(wait);
    var pics = document.createElement('div'); pics.className = 'pics'; body.insertBefore(pics, wait);
    var boxes = ids.map(function () { var d = document.createElement('div'); pics.appendChild(d); return d; });
    $('dbig').hidden = false;
    var left = ids.length;
    ids.forEach(function (id, i) {
      // 원본은 상세 보기를 열 때만 드라이브에서 받는다
      api(API + '/' + id + '?alt=media').then(function (r) { return r.arrayBuffer(); })
        .then(function (buf) { return secret ? openBytes(new Uint8Array(buf)) : buf; })
        .then(function (buf) { put(boxes[i], URL.createObjectURL(new Blob([buf]))); })
        .catch(function () {})
        .then(function () { if (--left === 0) wait.remove(); });
    });
  }

  function openDetail(it) {
    shown = it;
    $('dtitle').textContent = (it.favorite ? '★ ' : '') + (it.title || '');
    var body = $('dbody'); leaveBig(); $('dbig').hidden = true; body.innerHTML = ''; $('dfoot').innerHTML = '';
    if (it.locked) {
      if (!it.enc || !data.lock) {
        var p = document.createElement('p'); p.textContent = '🔒 ' + t('lockedNote'); body.appendChild(p);
      } else if (!lockKey) {
        askPassword(it, body);
      } else {
        openBytes(b64(it.enc)).then(function (plain) {
          var secret = JSON.parse(new TextDecoder().decode(plain));
          detailBody(it, body, secret.text, secret.tags, true);
        }).catch(function () { lockKey = null; openDetail(it); });
      }
    } else {
      detailBody(it, body, it.text, it.tags, false);
    }
    if (!$('dlg').open) $('dlg').showModal();
  }

  function detailBody(it, body, text, tags, secret) {
    leaveBig(); $('dbig').hidden = true;
    body.innerHTML = ''; $('dfoot').innerHTML = '';
    if (it.kind === 'memo') {
      var m = document.createElement('div'); m.className = 'full'; m.textContent = text || ''; body.appendChild(m);
    } else {
      showImages(it, body, secret);
    }
    var info = document.createElement('div'); info.className = 'sub';
    info.textContent = t('created') + ' ' + fmt(it.createdAt) + ' · ' + t('updated') + ' ' + fmt(it.updatedAt) +
      ((tags && tags.length) ? ' · #' + tags.join(' #') : '');
    body.appendChild(info);
    if (it.locked) return;
    // 잠기지 않은 항목만 PC 에서 고치고 지운다. 그림 항목은 이름 · 태그만.
    var acts = document.createElement('div'); acts.className = 'acts';
    var edit = document.createElement('button'); edit.type = 'button'; edit.textContent = t('edit');
    edit.onclick = function () { editForm(it); };
    var del = document.createElement('button'); del.type = 'button'; del.className = 'danger'; del.textContent = t('del');
    del.onclick = function () {
      if (!confirm(t('delConfirm'))) return;
      del.disabled = true;
      addEdit({ id: it.id, op: 'delete', updatedAt: now() })
        .then(function () { $('dlg').close(); render(); })
        .catch(function (e) { del.disabled = false; if (e.message !== '401') alert(t('saveFailed', { e: e.message })); });
    };
    acts.appendChild(edit); acts.appendChild(del);
    $('dfoot').appendChild(acts);
  }

  // 새 메모(it 없음) · 고치기
  function editForm(it) {
    shown = it || null;
    $('dtitle').textContent = it ? it.title : t(tab === 'note' ? 'newNoteTitle' : 'newTitle');
    var body = $('dbody'); leaveBig(); $('dbig').hidden = true; body.innerHTML = ''; $('dfoot').innerHTML = '';
    var form = document.createElement('form'); form.className = 'ed';
    var title = document.createElement('input'); title.placeholder = t('titlePh'); title.value = !it ? '' : (it.isNew && it.title === firstLine(it.text)) ? '' : (it.title || '');
    var text = null;
    if (!it || it.kind === 'memo') {
      text = document.createElement('textarea'); text.placeholder = t('textPh'); text.value = it ? (it.text || '') : '';
    }
    var tags = document.createElement('input'); tags.placeholder = t('tagsPh'); tags.value = it && it.tags ? it.tags.join(', ') : '';
    var note = document.createElement('p'); note.className = 'sub'; note.textContent = t('editNote');
    var acts = document.createElement('div'); acts.className = 'acts';
    var save = document.createElement('button'); save.type = 'submit'; save.textContent = t('save');
    var cancel = document.createElement('button'); cancel.type = 'button'; cancel.className = 'ghost'; cancel.textContent = t('cancel');
    cancel.onclick = function () { if (!canLeave()) return; if (it) openDetail(it); else $('dlg').close(); };
    dirty = false;
    form.oninput = function () { dirty = true; };
    var err = document.createElement('div'); err.className = 'err';
    acts.appendChild(save); acts.appendChild(cancel);
    form.appendChild(title); if (text) form.appendChild(text); form.appendChild(tags); form.appendChild(note); form.appendChild(err);
    // 저장 · 취소는 아래 고정 줄에 둔다 (form 속성으로 이 폼을 보낸다)
    form.id = 'edform'; save.setAttribute('form', 'edform');
    $('dfoot').appendChild(acts);
    form.onsubmit = function (e) {
      e.preventDefault();
      if (text && !text.value.trim()) { text.focus(); return; }
      var list = tags.value.split(/[,，、]/).map(function (x) { return x.trim().replace(/^#/, ''); }).filter(Boolean);
      var entry = { id: it ? it.id : newID(), op: it ? 'update' : 'add', title: title.value.trim(), tags: list, updatedAt: now() };
      if (text) entry.text = text.value;
      if (!it) entry.note = tab === 'note';
      save.disabled = true; err.textContent = '';
      addEdit(entry).then(function () {
        dirty = false;
        render();
        var fresh = merged().filter(function (x) { return x.id === entry.id; })[0];
        if (fresh) openDetail(fresh); else $('dlg').close();
      }).catch(function (e2) { save.disabled = false; if (e2.message !== '401') err.textContent = t('saveFailed', { e: e2.message }); });
    };
    body.appendChild(form);
    if (!$('dlg').open) $('dlg').showModal();
    setTimeout(function () { (text || title).focus(); }, 50);
  }
  $('add').addEventListener('click', function () { if (syncID) editForm(null); });

  function askPassword(it, body) {
    var form = document.createElement('form'); form.className = 'unlock';
    var p = document.createElement('p'); p.textContent = '🔒 ' + t('askPassword');
    var input = document.createElement('input'); input.type = 'password'; input.autocomplete = 'current-password';
    input.placeholder = t('password');
    var go = document.createElement('button'); go.type = 'submit'; go.textContent = t('open');
    var err = document.createElement('div'); err.className = 'err';
    form.appendChild(p); form.appendChild(input); form.appendChild(go); form.appendChild(err);
    form.onsubmit = function (e) {
      e.preventDefault();
      if (!input.value) return;
      go.disabled = true; err.textContent = '';
      unlock(input.value).then(function () { openDetail(it); })
        .catch(function () { go.disabled = false; err.textContent = t('wrongPassword'); input.select(); });
    };
    body.appendChild(form);
    setTimeout(function () { input.focus(); }, 50);
  }
  // 수정 중에 고친 것이 있으면 닫기 전에 묻는다 (닫기 버튼 · 바깥 클릭 · Esc · 취소)
  var dirty = false;
  function canLeave() { if (!dirty || confirm(t('discard'))) { dirty = false; return true; } return false; }
  $('dclose').addEventListener('click', function () { if (canLeave()) $('dlg').close(); });
  $('dlg').addEventListener('cancel', function (e) {
    if (big) { e.preventDefault(); leaveBig(); return; }   // Esc: 먼저 원래 크기로
    if (!canLeave()) e.preventDefault();
  });
  $('dlg').addEventListener('close', function () { leaveBig(); });

  // 크게 보기 (노트 · 캡쳐 원본)
  var big = false, zs = 1, zx = 0, zy = 0, drag = null;
  function pics() { return $('dbody').querySelector('.pics'); }
  function picWidth() { var im = pics() && pics().querySelector('img'); return (im && im.naturalWidth) || 1179; }
  function applyZoom() {
    var p = pics(); if (!p) return;
    p.style.width = picWidth() + 'px';
    p.style.transform = 'translate(' + zx + 'px,' + zy + 'px) scale(' + zs + ')';
    $('zpct').textContent = Math.round(zs * 100) + '%';
  }
  function zoomAt(k, mx, my) {
    var n = Math.min(8, Math.max(0.05, zs * k)); k = n / zs; zs = n;
    zx = mx - (mx - zx) * k; zy = my - (my - zy) * k; applyZoom();
  }
  function fit() { var w = $('dbody').clientWidth; zs = Math.min(1, w / picWidth()); zx = (w - picWidth() * zs) / 2; zy = 0; applyZoom(); }
  function enterBig() { big = true; $('dlg').classList.add('big'); $('zctl').hidden = false; requestAnimationFrame(fit); }
  function leaveBig() {
    if (!big) return;
    big = false; $('dlg').classList.remove('big'); $('zctl').hidden = true;
    var p = pics(); if (p) { p.style.transform = ''; p.style.width = ''; }
  }
  $('dbig').addEventListener('click', function () { if (big) leaveBig(); else enterBig(); });
  function center() { var b = $('dbody'); return [b.clientWidth / 2, b.clientHeight / 2]; }
  $('zin').addEventListener('click', function () { var c = center(); zoomAt(1.25, c[0], c[1]); });
  $('zout').addEventListener('click', function () { var c = center(); zoomAt(0.8, c[0], c[1]); });
  $('z1').addEventListener('click', function () { var c = center(); zoomAt(1 / zs, c[0], c[1]); });
  $('dbody').addEventListener('wheel', function (e) {
    if (!big) return;
    e.preventDefault();
    var r = $('dbody').getBoundingClientRect();
    zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  $('dbody').addEventListener('pointerdown', function (e) {
    if (!big) return;
    drag = { x: e.clientX - zx, y: e.clientY - zy }; $('dbody').classList.add('drag'); $('dbody').setPointerCapture(e.pointerId);
  });
  $('dbody').addEventListener('pointermove', function (e) { if (!drag) return; zx = e.clientX - drag.x; zy = e.clientY - drag.y; applyZoom(); });
  function endDrag() { drag = null; $('dbody').classList.remove('drag'); }
  $('dbody').addEventListener('pointerup', endDrag);
  $('dbody').addEventListener('pointercancel', endDrag);
  $('logout').addEventListener('click', function () { relock(); forget(); data = null; edits = []; });
  $('dlg').addEventListener('click', function (e) { if (e.target === $('dlg') && canLeave()) $('dlg').close(); });

  // 썸네일은 화면에 보일 때만 받는다
  var watcher = 'IntersectionObserver' in window ? new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      watcher.unobserve(e.target);
      fetchThumb(e.target.dataset.thumb, e.target);
    });
  }, { rootMargin: '300px' }) : null;
  function loadThumb(id, box) {
    if (thumbURLs[id]) return put(box, thumbURLs[id]);
    box.dataset.thumb = id;
    if (watcher) watcher.observe(box); else fetchThumb(id, box);
  }
  function fetchThumb(id, box) {
    api(API + '/' + id + '?alt=media').then(function (r) { return r.blob(); }).then(function (b) {
      thumbURLs[id] = URL.createObjectURL(b); put(box, thumbURLs[id]);
    }).catch(function () {});
  }
  function put(box, url) { box.innerHTML = ''; var img = document.createElement('img'); img.src = url; img.alt = ''; box.appendChild(img); }

  applyLang();
  try {
    var saved = JSON.parse(sessionStorage.getItem(TOKEN_STORE) || 'null');
    if (saved && saved.t && saved.exp > Date.now()) { token = saved.t; load(); }
  } catch (e) {}
})();
</script>
</body>
</html>
