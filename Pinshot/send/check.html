<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title data-i18n="title">Pinshot 연결 점검</title>
<style>
  :root { --bg: #f4f5f8; --card: #fff; --ink: #1b2030; --ink2: #5a6275; --line: #d6dae2; --ok: #1f8f3e; --bad: #d64545; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111317; --card: #1b1e24; --ink: #eceff5; --ink2: #a9b2c3; --line: #2f3540; --ok: #4cd07a; --bad: #ff6b6b; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; line-height: 1.55; padding: 32px 16px 48px; }
  main { max-width: 560px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 22px; margin: 0; }
  p { margin: 0; color: var(--ink2); font-size: 15px; }
  table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
  td { padding: 9px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  td.r { text-align: right; white-space: nowrap; font-weight: 600; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .wait { color: var(--ink2); }
  small { color: var(--ink2); }
  pre { margin: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1 data-i18n="title">Pinshot 연결 점검</h1>
  <p data-i18n="intro">이 PC의 인터넷에서 PC에서 보내기에 쓸 수 있는 중계 서버 후보가 열리는지 확인합니다. 아무것도 보내지 않고, 열리는지만 봅니다.</p>
  <table id="t"></table>
  <p data-i18n="copy">아래 결과를 그대로 복사해 알려 주세요.</p>
  <pre id="out" data-i18n="checking">확인하는 중…</pre>
</main>
<script>
(function () {
  // 언어: 주소 ?lang= → 보내기 페이지에서 고른 것 → 브라우저 언어 → 영어 (index.html 과 같은 규칙)
  var I18N = {
    ko: { title: 'Pinshot 연결 점검', intro: '이 PC의 인터넷에서 PC에서 보내기에 쓸 수 있는 중계 서버 후보가 열리는지 확인합니다. 아무것도 보내지 않고, 열리는지만 봅니다.',
          copy: '아래 결과를 그대로 복사해 알려 주세요.', checking: '확인하는 중…', inUse: 'ntfy.sh (지금 쓰는 중계)', asReply: 'Apps Script 응답 주소',
          fbIo: 'Firebase 실시간 DB (firebaseio)', fbAsia: 'Firebase 실시간 DB (아시아)', fbStorage: 'Firebase 저장소', wdev: 'workers.dev 주소',
          wait: '확인 중', open: '열림', blocked: '막힘', timeout: '시간 초과', refused: '연결 거부' },
    en: { title: 'Pinshot Connection Check', intro: 'Checks whether this PC’s internet can reach the relay server candidates used for sending from PC. Nothing is sent; it only checks that they open.',
          copy: 'Copy the result below as-is and send it to us.', checking: 'Checking…', inUse: 'ntfy.sh (relay in use)', asReply: 'Apps Script response host',
          fbIo: 'Firebase Realtime DB (firebaseio)', fbAsia: 'Firebase Realtime DB (Asia)', fbStorage: 'Firebase Storage', wdev: 'workers.dev host',
          wait: 'Checking', open: 'Open', blocked: 'Blocked', timeout: 'timed out', refused: 'connection refused' },
    ja: { title: 'Pinshot 接続チェック', intro: 'この PC のインターネットから、PC から送る機能で使える中継サーバー候補につながるか確認します。何も送らず、つながるかだけを見ます。',
          copy: '下の結果をそのままコピーして知らせてください。', checking: '確認中…', inUse: 'ntfy.sh（現在使用中の中継）', asReply: 'Apps Script 応答ホスト',
          fbIo: 'Firebase Realtime DB（firebaseio）', fbAsia: 'Firebase Realtime DB（アジア）', fbStorage: 'Firebase Storage', wdev: 'workers.dev ホスト',
          wait: '確認中', open: '接続可', blocked: 'ブロック', timeout: 'タイムアウト', refused: '接続拒否' },
    zh: { title: 'Pinshot 连接检查', intro: '检查这台电脑的网络能否连上“从电脑发送”可用的中继服务器候选。不会发送任何内容，只检查能否连接。',
          copy: '请把下面的结果原样复制后告诉我们。', checking: '正在检查…', inUse: 'ntfy.sh（当前使用的中继）', asReply: 'Apps Script 响应主机',
          fbIo: 'Firebase 实时数据库（firebaseio）', fbAsia: 'Firebase 实时数据库（亚洲）', fbStorage: 'Firebase 存储', wdev: 'workers.dev 主机',
          wait: '检查中', open: '可连接', blocked: '被阻止', timeout: '超时', refused: '连接被拒绝' }
  };
  function pickLang() {
    try { var q = new URLSearchParams(location.search).get('lang'); if (q && I18N[q.slice(0, 2)]) return q.slice(0, 2); } catch (e) {}
    try { var s = localStorage.getItem('pinshotLang'); if (s && I18N[s]) return s; } catch (e) {}
    var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
    for (var i = 0; i < list.length; i++) { var c = String(list[i]).slice(0, 2).toLowerCase(); if (I18N[c]) return c; }
    return 'en';
  }
  var L = I18N[pickLang()];
  document.documentElement.lang = pickLang() === 'zh' ? 'zh-Hans' : pickLang();
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) { el.textContent = L[el.dataset.i18n]; });
  // 열리기만 하면 되므로 응답 내용은 읽지 않는다 (no-cors). 막혀 있으면 네트워크 오류가 난다.
  var targets = [
    [L.inUse, 'https://ntfy.sh/v1/health'],
    ['Google Apps Script', 'https://script.google.com/favicon.ico'],
    [L.asReply, 'https://script.googleusercontent.com/'],
    [L.fbIo, 'https://pinshot-check-0.firebaseio.com/.json'],
    [L.fbAsia, 'https://pinshot-check-0-default-rtdb.asia-southeast1.firebasedatabase.app/.json'],
    [L.fbStorage, 'https://firebasestorage.googleapis.com/'],
    ['Google Firebase', 'https://firestore.googleapis.com/'],
    ['Google Drive API', 'https://www.googleapis.com/discovery/v1/apis'],
    ['GitHub API', 'https://api.github.com/'],
    ['Cloudflare Workers', 'https://workers.cloudflare.com/'],
    [L.wdev, 'https://pinshot-check.workers.dev/'],
    ['Supabase', 'https://supabase.com/favicon.ico'],
    ['Pusher', 'https://sockjs.pusher.com/'],
    ['Ably', 'https://rest.ably.io/time']
  ];
  var t = document.getElementById('t'), results = [];
  targets.forEach(function (x, i) {
    var tr = t.insertRow(); tr.insertCell().innerHTML = '<span></span><br><small></small>';
    tr.cells[0].firstChild.textContent = x[0]; tr.cells[0].lastChild.textContent = new URL(x[1]).host;
    var r = tr.insertCell(); r.className = 'r wait'; r.textContent = L.wait;
    var done = false, started = Date.now();
    var timer = setTimeout(function () { finish(false, L.timeout); }, 10000);
    function finish(ok, why) {
      if (done) return; done = true; clearTimeout(timer);
      r.className = 'r ' + (ok ? 'ok' : 'bad'); r.textContent = ok ? L.open : L.blocked;
      results[i] = (ok ? 'O ' : 'X ') + x[0] + (ok ? ' (' + (Date.now() - started) + 'ms)' : ' (' + why + ')');
      if (results.filter(Boolean).length === targets.length) document.getElementById('out').textContent = results.join('\n') + '\n' + navigator.userAgent;
    }
    fetch(x[1], { mode: 'no-cors', cache: 'no-store' }).then(function () { finish(true); }, function () { finish(false, L.refused); });
  });
})();
</script>
</body>
</html>
